<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FY27 H2 · ACO Big Bets</title>
<style>
  /* ============================================================
     Langage visuel : Apple / iPad Pro keynote.
     SF Pro (stack système Apple, rendu natif sur macOS).
     Noir #000 dominant, une respiration blanche (adoption LVMH).
     Couleurs = système Apple. Reveal scroll = fade + scale + blur.
     ============================================================ */
  :root {
    --black: #000000;
    --panel: #131316;      /* tuile sombre élevée */
    --panel-2: #1c1c1e;    /* tuile sur tuile */
    --hair: rgba(255, 255, 255, 0.10);
    --hair-soft: rgba(255, 255, 255, 0.06);
    --white: #f5f5f7;      /* texte sur noir */
    --grey: #86868b;       /* gris Apple */
    --grey-2: #6e6e73;
    --ink: #1d1d1f;        /* texte sur blanc */
    --ink-grey: #6e6e73;
    --blue: #2997ff;       /* bleu Apple sombre */
    --blue-light: #0071e3; /* bleu Apple clair (sections blanches) */
    --green: #30d158;
    --amber: #ff9f0a;
    --red: #ff453a;
    --r: 22px;
    --r-lg: 30px;
    --maxw: 1080px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 56px; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  body.locked { overflow: hidden; height: 100vh; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; position: relative; }
  .narrow { max-width: 820px; }
  .center { text-align: center; margin-left: auto; margin-right: auto; }
  .num { font-variant-numeric: tabular-nums; }

  /* ============ GATE ============ */
  .gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: #000; padding: 24px;
    transition: opacity 0.8s var(--ease), visibility 0.8s;
  }
  .gate.open { opacity: 0; visibility: hidden; }
  .gate-card { width: 100%; max-width: 400px; text-align: center; animation: fadeUp 0.9s var(--ease) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .gate-eyebrow { color: var(--blue); font-size: 15px; font-weight: 600; letter-spacing: 0.01em; margin-bottom: 10px; }
  .gate-card h1 { font-size: 40px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; margin-bottom: 32px; }
  .gate-input {
    width: 100%; background: #1c1c1e; border: 1px solid transparent; border-radius: 14px;
    color: var(--white); font-family: var(--font); font-size: 17px; padding: 15px 18px; text-align: center;
    transition: border-color 0.25s, background 0.25s;
  }
  .gate-input::placeholder { color: var(--grey-2); }
  .gate-input:focus { outline: none; border-color: var(--blue); background: #202024; }
  .gate-btn {
    width: 100%; margin-top: 12px; background: var(--blue); color: #fff; border: none; border-radius: 980px;
    font-family: var(--font); font-weight: 500; font-size: 17px; padding: 15px; cursor: pointer;
    transition: transform 0.15s var(--ease), background 0.25s;
  }
  .gate-btn:hover { background: #3aa0ff; }
  .gate-btn:active { transform: scale(0.97); }
  .gate-err { color: var(--red); font-size: 14px; margin-top: 16px; min-height: 18px; opacity: 0; transition: opacity 0.2s; }
  .gate-err.show { opacity: 1; }
  .gate-hint { color: var(--grey-2); font-size: 13px; margin-top: 28px; }

  /* ============ NAV ============ */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40; height: 52px;
    display: flex; align-items: center;
    background: rgba(0, 0, 0, 0.60);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--hair-soft);
    opacity: 0; transform: translateY(-100%);
    transition: transform 0.6s var(--ease), opacity 0.6s;
  }
  nav.show { transform: none; opacity: 1; }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 32px; max-width: 1280px; }
  .nav-brand { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
  .nav-brand .glyph { color: var(--grey); font-weight: 400; }
  .nav-links { display: flex; gap: 2px; }
  .nav-links a {
    color: var(--grey); text-decoration: none; font-size: 13px; font-weight: 400;
    padding: 6px 12px; border-radius: 980px; transition: color 0.25s, background 0.25s; white-space: nowrap;
  }
  .nav-links a:hover { color: var(--white); }
  .nav-links a.active { color: var(--white); background: rgba(255, 255, 255, 0.08); }

  /* ============ SECTIONS ============ */
  section { padding: 130px 0; position: relative; }
  section.tight { padding: 90px 0; }
  section.light { background: #fbfbfd; color: var(--ink); }
  /* LVMH : la vidéo est collée au noir de la section précédente ; le titre respire en dessous */
  section.light#lvmh { padding-top: 0; }
  section.light#lvmh > .wrap { padding-top: 96px; }
  section.light .eyebrow { color: var(--blue-light); }
  section.light .grey { color: var(--ink-grey); }

  .eyebrow { color: var(--blue); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
  .grey { color: var(--grey); }

  h2.big { font-size: clamp(38px, 6vw, 72px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.03; }
  .lede { font-size: clamp(19px, 2.4vw, 26px); font-weight: 400; letter-spacing: -0.015em; line-height: 1.35; margin-top: 18px; }
  .chapter-head { margin-bottom: 72px; }

  /* Reveal */
  .reveal { opacity: 0; transform: translateY(44px) scale(0.965); filter: blur(8px); transition: opacity 1s var(--ease), transform 1s var(--ease), filter 1s var(--ease); }
  .reveal.in { opacity: 1; transform: none; filter: none; }

  /* ============ HERO ============ */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 0 72px; gap: 60px; }
  .hero .eyebrow { font-size: 21px; }
  .hero h1 {
    font-size: clamp(52px, 10vw, 128px); font-weight: 600; letter-spacing: -0.045em; line-height: 0.95;
    margin: 6px 0 0;
  }
  .hero h1 .grad {
    background: linear-gradient(180deg, #ffffff 0%, #b0b0b8 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  }
  /* Placeholder pleine largeur pour le futur visuel Higgsfield */
  .hero-visual {
    width: 100%; aspect-ratio: 16 / 6; position: relative; overflow: hidden;
    display: grid; place-items: center;
    border-bottom: 1px solid var(--hair-soft);
    background:
      radial-gradient(65% 130% at 50% 0%, rgba(41, 151, 255, 0.10), transparent 70%),
      linear-gradient(135deg, #0a0a0c 0%, #131316 55%, #0a0a0c 100%);
    background-size: cover; background-position: center; /* prêt pour background-image */
  }
  .hero-visual .hv-img,
  .hero-visual .hv-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Contrôles vidéo : overlay givré, même opacité que la nav, calé en bas de la vidéo */
  .hero-controls {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 5;
    display: flex; align-items: center; gap: 4px; padding: 5px;
    background: rgba(0, 0, 0, 0.60);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid var(--hair-soft); border-radius: 980px;
    opacity: 0; transition: opacity 0.6s var(--ease) 0.4s;
  }
  .hero-visual.in .hero-controls { opacity: 1; }
  .hc-btn {
    display: grid; place-items: center; width: 34px; height: 34px; padding: 0;
    background: transparent; border: none; border-radius: 980px; cursor: pointer;
    color: rgba(255, 255, 255, 0.82); transition: color 0.2s, background 0.2s, transform 0.1s;
  }
  .hc-btn svg { fill: currentColor; }
  .hc-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.10); }
  .hc-btn:active { transform: scale(0.92); }
  .hero-visual .hv-hint {
    color: var(--grey-2); font-size: 14px; letter-spacing: 0.02em;
    padding: 11px 20px; border: 1px dashed var(--hair); border-radius: 980px;
    background: rgba(0, 0, 0, 0.28);
  }

  /* ============ BIG NUMBER MOMENT ============ */
  .huge {
    font-size: clamp(96px, 20vw, 240px); font-weight: 600; letter-spacing: -0.05em; line-height: 0.85;
    background: linear-gradient(180deg, #ffffff 0%, #9a9aa2 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .huge .pct { font-size: 0.42em; letter-spacing: -0.03em; }
  .quota-line { max-width: 620px; margin: 44px auto 0; }
  .qbar-track { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .qbar-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--blue-light), var(--blue)); transition: width 1.6s var(--ease); }
  .qbar-legend { display: flex; justify-content: space-between; margin-top: 12px; color: var(--grey); font-size: 14px; }

  .figrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin-top: 80px; border-top: 1px solid var(--hair); }
  .fig { padding: 30px 20px 0; border-right: 1px solid var(--hair); text-align: center; }
  .fig:last-child { border-right: none; }
  .fig .v { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; }
  .fig .v .u { font-size: 17px; color: var(--grey); font-weight: 400; margin-left: 2px; }
  .fig.accent .v { color: var(--blue); }
  .fig .k { color: var(--grey); font-size: 14px; margin-top: 8px; }

  /* ============ BETS ============ */
  .bets { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .bets-total {
    margin-top: 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 24px 40px; background: var(--panel); border-radius: var(--r-lg);
  }
  .bets-total .bt-lbl { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .bets-total .bt-hint { color: var(--grey); font-weight: 400; }
  .bets-total .bt-val { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: var(--blue); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bet {
    background: var(--panel); border-radius: var(--r-lg); padding: 40px;
    transition: transform 0.5s var(--ease), background 0.5s var(--ease);
  }
  .bet:hover { transform: translateY(-4px); background: #17171b; }
  .bet-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .bet-name { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; }
  .bet-entity { color: var(--grey); font-size: 14px; margin-top: 6px; }
  .sig { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; white-space: nowrap; flex: none; padding-top: 6px; }
  .sig .dot { width: 9px; height: 9px; border-radius: 50%; }
  .sig[data-c="green"] { color: var(--green); } .sig[data-c="green"] .dot { background: var(--green); box-shadow: 0 0 12px rgba(48,209,88,0.5); }
  .sig[data-c="amber"] { color: var(--amber); } .sig[data-c="amber"] .dot { background: var(--amber); box-shadow: 0 0 12px rgba(255,159,10,0.5); }
  .sig[data-c="red"]   { color: var(--red); }   .sig[data-c="red"] .dot   { background: var(--red);   box-shadow: 0 0 12px rgba(255,69,58,0.5); }
  .bet-uc { color: var(--grey); font-size: 16px; line-height: 1.5; margin: 22px 0 26px; }

  .bet-prog { margin-bottom: 26px; }
  .bet-prog .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--grey); margin-bottom: 10px; }
  .bet-prog .head b { color: var(--white); font-weight: 500; }
  .pbar { height: 5px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .pbar > i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 1.3s var(--ease); }
  .pbar[data-c="green"] > i { background: var(--green); }
  .pbar[data-c="amber"] > i { background: var(--amber); }
  .pbar[data-c="red"]   > i { background: var(--red); }
  /* Bets : barres en nuances de bleu Salesforce (charte SF) */
  .bet-prog .pbar > i { background: linear-gradient(90deg, #0176d3, var(--blue)); }

  .bet-figs { display: flex; gap: 32px; flex-wrap: wrap; padding: 24px 0; border-top: 1px solid var(--hair-soft); border-bottom: 1px solid var(--hair-soft); margin-bottom: 24px; }
  .bet-figs .cell .k { color: var(--grey); font-size: 12px; }
  .bet-figs .cell .v { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
  .bet-figs .cell.big .v { color: var(--blue); font-size: 26px; }

  .bet-block + .bet-block { margin-top: 22px; }
  .bet-block .lbl { color: var(--grey-2); font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; margin-bottom: 12px; }
  .bet-block ul { list-style: none; display: grid; gap: 10px; }
  .bet-block li { font-size: 15px; line-height: 1.45; padding-left: 22px; position: relative; color: var(--white); }
  .bet-block li::before { content: ""; position: absolute; left: 4px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
  .bet-block.flags li { color: var(--grey); }
  .bet-block.flags li::before { background: var(--grey-2); }

  /* ============ LVMH (light) ============ */
  .adopt { display: grid; gap: 0; border-top: 1px solid rgba(0,0,0,0.1); }
  .adopt-row { display: grid; grid-template-columns: 1.2fr 1fr 1.5fr; gap: 40px; align-items: center; padding: 40px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
  .adopt-uc { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .adopt-note { color: var(--ink-grey); font-size: 15px; margin-top: 6px; }
  .adopt-cap { color: var(--ink-grey); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .adopt-deploy .big { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .adopt-deploy .from { color: var(--ink-grey); font-size: 15px; margin-top: 6px; }
  .adopt-adopt .cap-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .adopt-adopt .cap-row b { font-size: 17px; font-weight: 600; color: var(--blue-light); }
  .lbar { height: 6px; border-radius: 999px; background: rgba(0,0,0,0.08); overflow: hidden; }
  .lbar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--blue-light); transition: width 1.4s var(--ease); }
  .adopt-advisors { color: var(--ink-grey); font-size: 13px; margin-top: 10px; }

  /* CTA plan d'accélération (section claire) */
  .plan-cta { margin-top: 48px; text-align: center; }
  .plan-note { color: var(--ink-grey); font-size: clamp(16px, 2vw, 19px); letter-spacing: -0.01em; margin-bottom: 20px; }
  .plan-link {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--blue-light); color: #fff; text-decoration: none;
    font-weight: 500; font-size: 17px; letter-spacing: -0.01em;
    padding: 14px 26px; border-radius: 980px;
    transition: transform 0.15s var(--ease), background 0.25s;
  }
  .plan-link:hover { background: #0a84ff; }
  .plan-link:active { transform: scale(0.97); }
  .plan-link svg { transition: transform 0.2s var(--ease); }
  .plan-link:hover svg { transform: translate(2px, -2px); }

  /* ============ TABLE ============ */
  .panel { background: var(--panel); border-radius: var(--r-lg); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  thead th { text-align: left; color: var(--grey); font-weight: 500; font-size: 13px; padding: 20px 24px; border-bottom: 1px solid var(--hair); }
  tbody td { padding: 20px 24px; border-bottom: 1px solid var(--hair-soft); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.2s; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  td.amt { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-weight: 500; }
  .acc { font-weight: 600; letter-spacing: -0.01em; }
  .sub { color: var(--grey); font-size: 13px; margin-top: 4px; }
  .next { color: var(--grey); font-size: 13px; max-width: 300px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 980px; white-space: nowrap; background: rgba(255,255,255,0.06); color: var(--grey); }
  .pill.s4 { color: var(--green); background: rgba(48,209,88,0.12); }
  .pill.s3 { color: var(--blue); background: rgba(41,151,255,0.12); }
  tfoot .total-row td { padding: 20px 24px; border-top: 1px solid var(--hair); background: rgba(255,255,255,0.03); vertical-align: middle; }
  tfoot .total-row td:first-child { font-weight: 600; letter-spacing: -0.01em; }
  tfoot .total-row .sub { margin-top: 2px; font-weight: 400; }
  tfoot .total-row td.amt { color: var(--blue); font-size: 17px; font-weight: 600; }

  /* watch */
  .watch { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .watch-card { background: var(--panel); border-radius: var(--r); padding: 24px; }
  .watch-card .amt { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .watch-card .acc { font-size: 15px; margin-top: 10px; }
  .watch-card .op { color: var(--grey); font-size: 13px; margin-top: 3px; line-height: 1.4; }
  .subhead { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 24px; }

  /* ============ C&C ============ */
  .cc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .cc-card { background: var(--panel); border-radius: var(--r); padding: 28px; display: flex; flex-direction: column; gap: 12px; }
  .cc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .cc-acc { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .cc-amt { color: var(--blue); font-weight: 600; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cc-op { color: var(--grey); font-size: 14px; line-height: 1.45; }
  .cc-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
  .tag { font-size: 12px; padding: 5px 11px; border-radius: 980px; background: rgba(255,255,255,0.06); color: var(--grey); }
  .tag.play { background: rgba(41,151,255,0.12); color: var(--blue); }

  /* ============ CONSO ============ */
  .conso { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .conso-card { background: var(--panel); border-radius: var(--r); padding: 30px; }
  .conso-card.warn { box-shadow: inset 0 0 0 1px rgba(255,159,10,0.35); }
  .conso-acc { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 20px; }
  .conso-nums { display: flex; gap: 26px; margin-bottom: 18px; }
  .conso-nums .k { color: var(--grey); font-size: 12px; }
  .conso-nums .v { font-size: 18px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .conso-status { font-size: 14px; color: var(--grey); line-height: 1.4; }
  .conso-card.warn .conso-status { color: var(--amber); }
  .callout { background: var(--panel); border-radius: var(--r-lg); padding: 36px 40px; box-shadow: inset 0 0 0 1px rgba(255,159,10,0.25); }
  .callout .lbl { color: var(--amber); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; margin-bottom: 14px; }
  .callout p { color: var(--grey); font-size: 16px; line-height: 1.55; }
  .callout p + p { margin-top: 12px; }
  .callout b { color: var(--white); font-weight: 600; }

  /* ============ RISKS + ASKS ============ */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
  .block-title { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; text-transform: uppercase; color: var(--grey); margin-bottom: 28px; display: flex; align-items: center; gap: 10px; }
  .block-title .d { width: 9px; height: 9px; border-radius: 50%; }
  .stack .item { display: flex; gap: 18px; align-items: flex-start; padding: 18px 0; border-top: 1px solid var(--hair-soft); font-size: 16px; line-height: 1.5; }
  .stack .item:first-child { border-top: none; }
  .stack .n { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--grey-2); flex: none; min-width: 26px; padding-top: 2px; font-weight: 500; }
  .asks .item { color: var(--white); } .asks .n { color: var(--blue); }
  .risks .item { color: var(--grey); }

  /* ============ FOOTER ============ */
  footer { padding: 60px 0 80px; border-top: 1px solid var(--hair-soft); }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
  footer .brand { font-size: 15px; font-weight: 600; }
  footer .meta { color: var(--grey-2); font-size: 13px; }

/* ===== Animations ===== */
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function animateCount(el) {
  const target = parseFloat(el.dataset.target);
  const dec = parseInt(el.dataset.dec || "0", 10);
  const fmt = v => dec ? v.toFixed(dec) : Math.round(v).toLocaleString('fr-FR');
  if (reduce) { el.textContent = fmt(target); return; }
  const dur = 1400, start = performance.now();
  function tick(now) {
    const p = Math.min((now - start) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(target * e);
    if (p < 1) requestAnimationFrame(tick); else el.textContent = fmt(target);
  }
  requestAnimationFrame(tick);
}

function fillBars(scope) {
  scope.querySelectorAll(".qbar-fill, .pbar > i, .lbar > i").forEach(b => { if (b.dataset.w) b.style.width = b.dataset.w + "%"; });
}

function initReveals() {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target;
      el.classList.add("in");
      el.querySelectorAll(".cnt").forEach(animateCount);
      fillBars(el);
      io.unobserve(el);
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  // bars living inside reveal-less containers still fill when their section shows
  const io2 = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) { fillBars(en.target); en.target.querySelectorAll(".cnt").forEach(animateCount); io2.unobserve(en.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll("section").forEach(s => io2.observe(s));
}

function initScrollSpy() {
  const links = [...document.querySelectorAll(".nav-links a")];
  const map = links.map(a => ({ a, sec: document.querySelector(a.getAttribute("href")) })).filter(x => x.sec);
  const spy = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) { links.forEach(l => l.classList.remove("active")); const m = map.find(x => x.sec === en.target); if (m) m.a.classList.add("active"); }
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  map.forEach(x => spy.observe(x.sec));
}

function initVideo(container) {
  const v = container.querySelector(".hv-video");
  if (!v) return;
  const btnPlay = container.querySelector(".hc-play");
  const btnSound = container.querySelector(".hc-sound");
  const icPause = btnPlay.querySelector(".ic-pause");
  const icPlay = btnPlay.querySelector(".ic-play");
  const icOn = btnSound.querySelector(".ic-soundon");
  const icOff = btnSound.querySelector(".ic-soundoff");

  const syncPlay = () => {
    const playing = !v.paused && !v.ended;
    icPause.style.display = playing ? "" : "none";
    icPlay.style.display = playing ? "none" : "";
  };
  const syncSound = () => {
    icOn.style.display = v.muted ? "none" : "";
    icOff.style.display = v.muted ? "" : "none";
  };

  if (container.dataset.sound === "first") {
    // Son sur la première boucle (autorisé si le déverrouillage vient d'un clic),
    // sinon repli propre en muet si le navigateur bloque l'autoplay sonore.
    v.muted = false; v.volume = 1;
    const p = v.play();
    if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); syncSound(); });
    // Fin de la 1re lecture : on coupe le son et on passe en boucle muette.
    v.addEventListener("ended", () => {
      v.muted = true; v.loop = true; v.currentTime = 0; v.play().catch(() => {}); syncSound();
    }, { once: true });
  } else {
    // Muet par défaut, en boucle ; le son reste activable via le bouton.
    v.muted = true; v.loop = true; v.play().catch(() => {});
  }

  btnPlay.addEventListener("click", () => { if (v.paused) v.play().catch(() => {}); else v.pause(); syncPlay(); });
  btnSound.addEventListener("click", () => { v.muted = !v.muted; if (!v.muted) v.play().catch(() => {}); syncSound(); });
  v.addEventListener("play", syncPlay);
  v.addEventListener("pause", syncPlay);
  v.addEventListener("volumechange", syncSound);

  syncPlay(); syncSound();
}

function initVideos() { document.querySelectorAll(".video-hero").forEach(initVideo); }

function boot() {
  render();
  document.getElementById("nav").classList.add("show");
  document.getElementById("app").setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => { initReveals(); initScrollSpy(); initVideos(); });
}

const err = document.getElementById("err");

function unlock() { gate.classList.add("open"); document.body.classList.remove("locked"); try { sessionStorage.setItem("aco_ok", "1"); } catch (e) {} boot(); }

form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (pw.value === PW) unlock();
  else { err.classList.add("show"); pw.value = ""; pw.focus(); }
});

try {
  if (sessionStorage.getItem("aco_ok") === "1") { gate.classList.add("open"); document.body.classList.remove("locked"); boot(); }
  else setTimeout(() => pw.focus(), 500);
} catch (e) { setTimeout(() => pw.focus(), 500); }
</script>
